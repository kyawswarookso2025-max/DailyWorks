    .danger { background: #dc2626; }

    .actions { display: flex; gap: 10px; margin-top: 15px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }
    .card {
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      font-size: 13px;
    }
    .card strong { display: block; font-size: 21px; }
    .scroll { overflow-x: auto; }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 660px;
      margin-top: 14px;
      font-size: 14px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    td button { padding: 5px 9px; font-size: 13px; }
    #message { min-height: 28px; color: #166534; }
    #dailyNet { font-weight: bold; color: #1d4ed8; }
    @media (max-width: 600px) {

      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }

</head>

</main>

- အလုပ်ချိန် ၈ နာရီ၊ နေ့စားလုပ်အားခ၊ OT ကြေး မှတ်နိုင်မယ်။

- လစဉ်ဝင်ငွေ၊ အသုံးစရိတ်၊ ကျန်ငွေ တွက်ပေးမယ်။

        </div>
        <div>
          <label for="hours">ပုံမှန် အလုပ်ချိန် — နာရီ</label>
          <input id="hours" type="number" min="0" max="24"
                 step="any" value="8" required>
        </div>
        <div>
          <label for="wage">အဲဒီနေ့ လုပ်အားခ</label>
          <input id="wage" type="number" min="0"
                 step="any" value="0" required>
        </div>
        <div>
          <label for="ot">အဲဒီနေ့ OT ကြေး</label>
          <input id="ot" type="number" min="0"
                 step="any" value="0" required>
        </div>
        <div>
          <label for="room">အဲဒီနေ့ အခန်းခ</label>
          <input id="room" type="number" min="0"
                 step="any" value="0" required>
        </div>
        <div>
          <label for="fuel">ဆိုင်ကယ် ဆီဖိုး</label>
          <input id="fuel" type="number" min="0"
                 step="any" value="0" required>
        </div>
        <div>
          <label for="other">အခြား အသုံးစရိတ်</label>
          <input id="other" type="number" min="0"
                 step="any" value="0" required>
        </div>
      </div>
      <div style="margin-top:14px">
        <label for="note">မှတ်ချက်</label>
        <textarea id="note" rows="2" maxlength="500"></textarea>
      </div>
      <div class="preview" id="preview"></div>
      <div class="actions">
        <button type="submit">💾 နေ့စာရင်း သိမ်းမယ်</button>
        <button type="button" class="secondary" id="resetForm">
          အသစ်ဖြည့်မယ်
        </button>
      </div>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>📊 လစဉ် စာရင်းချုပ်</h2>
    <label for="month">ကြည့်ချင်တဲ့လ</label>
    <input id="month" type="month" style="max-width:260px">
    <p id="attendance" class="muted"></p>
    <div class="summary">
      <div class="stat">လုပ်အားခ<strong id="sumWage">0</strong></div>
      <div class="stat">OT ကြေး<strong id="sumOt">0</strong></div>
      <div class="stat">အသုံးစရိတ်<strong id="sumExpense">0</strong></div>
      <div class="stat">ကျန်ငွေ<strong id="sumNet">0</strong></div>
    </div>
    <button id="exportCsv" class="secondary" style="margin-top:16px">
      📥 စာရင်းအားလုံး CSV ထုတ်ယူရန်
    </button>
  </section>

  <section class="card">
    <h2>🗂️ ရွေးထားတဲ့လ၏ မှတ်တမ်းများ</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ရက်စွဲ</th><th>အခြေအနေ</th><th>နာရီ</th>
            <th>လုပ်အားခ</th><th>OT</th><th>အခန်းခ</th>
            <th>ဆီဖိုး</th><th>အခြား</th><th>ကျန်ငွေ</th>
            <th>မှတ်ချက်</th><th>ပြင် / ဖျက်</th>
          </tr>
        </thead>
        <tbody id="records"></tbody>
      </table>
    </div>
    <p class="muted">
      စာရင်းများကို ဒီ browser ထဲမှာသာ သိမ်းထားပါတယ်။
      အရေးကြီးစာရင်းတွေကို CSV မိတ္တူ ထုတ်ထားပါ။
    </p>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const KEY = "myDailyWorkLedger_v1";
  let data = {
    settings: { wage: 0, currency: "ကျပ်" },
    entries: {}
  };

  function message(text, error = false) {
    $("message").textContent = text;
    $("message").style.color = error ? "#dc2626" : "#15803d";
  }

  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (!parsed.settings || !parsed.entries ||
          typeof parsed.entries !== "object") {
        throw new Error("Invalid saved data");
      }
      data = parsed;
    }
  } catch (error) {
    message("သိမ်းထားတဲ့စာရင်း ဖတ်မရပါ။ Browser ဒေတာအခြေအနေ စစ်ပါ။", true);
  }

  function persist(next) {
    try {
      localStorage.setItem(KEY, JSON.stringify(next));
      data = next;
      return true;
    } catch (error) {
      message("သိမ်းမရပါ။ Browser storage ခွင့်ပြုထားမှုနဲ့ နေရာလွတ်ကို စစ်ပါ။", true);
      return false;
    }
  }

  function today() {
    const d = new Date();
    return [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, "0"),
      String(d.getDate()).padStart(2, "0")
    ].join("-");
  }

  function num(id) { return Number($(id).value) || 0; }
  function format(n) {
    return Number(n).toLocaleString("en-US", {
      maximumFractionDigits: 2
    });
  }
  function money(n) {
    return format(n) + " " + data.settings.currency;
  }
  function expense(e) { return e.room + e.fuel + e.other; }
  function net(e) { return e.wage + e.ot - expense(e); }

  const statusLabels = {
    work: "အလုပ်ဆင်း", off: "နားရက်", leave: "ခွင့်ရက်"
  };
  const numberFields = ["hours", "wage", "ot", "room", "fuel", "other"];

  function readEntry() {
    return {
      date: $("date").value,
      status: $("status").value,
      hours: num("hours"),
      wage: num("wage"),
      ot: num("ot"),
      room: num("room"),
      fuel: num("fuel"),
      other: num("other"),
      note: $("note").value.trim()
    };
  }

  function preview() {
    $("preview").textContent =
      "ဒီနေ့ ကျန်ငွေ = " + money(net(readEntry()));
  }

  function loadDate(date) {
    $("date").value = date;
    const e = data.entries[date];
    $("status").value = e ? e.status : "work";
    $("hours").value = e ? e.hours : 8;
    $("wage").value = e ? e.wage : data.settings.wage;
    ["ot", "room", "fuel", "other"].forEach(id => {
      $(id).value = e ? e[id] : 0;
    });
    $("note").value = e ? e.note : "";
    $("message").textContent = e
      ? "ဒီရက်အတွက် စာရင်းရှိပြီးသားပါ။ ပြင်ပြီး ပြန်သိမ်းနိုင်ပါတယ်။"
      : "";
    preview();
  }

  function render() {
    const entries = Object.values(data.entries)
      .filter(e => e.date.startsWith($("month").value))
      .sort((a, b) => b.date.localeCompare(a.date));

    let wages = 0, ots = 0, expenses = 0, hours = 0, workDays = 0;
    const tbody = $("records");
    tbody.replaceChildren();

    entries.forEach(e => {
      wages += e.wage;
      ots += e.ot;
      expenses += expense(e);
      hours += e.hours;
      if (e.status === "work") workDays++;

      const tr = document.createElement("tr");
      const values = [
        e.date, statusLabels[e.status], format(e.hours),
        format(e.wage), format(e.ot), format(e.room),
        format(e.fuel), format(e.other), format(net(e)), e.note
      ];
      values.forEach(value => {
        const td = document.createElement("td");
        td.textContent = value;
        tr.appendChild(td);
      });

      const actions = document.createElement("td");
      const edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "ပြင်";
      edit.onclick = () => {
        loadDate(e.date);
        $("entryForm").scrollIntoView({
          behavior: "smooth", block: "start"
        });
      };

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "danger";
      remove.textContent = "ဖျက်";
      remove.onclick = () => {
        if (!confirm(e.date + " စာရင်းကို ဖျက်မလား?")) return;
        const next = {
          settings: { ...data.settings },
          entries: { ...data.entries }
        };
        delete next.entries[e.date];
        if (persist(next)) {
          if ($("date").value === e.date) loadDate(e.date);
          render();
          message("စာရင်း ဖျက်ပြီးပါပြီ။");
        }
      };

      actions.append(edit, remove);
      tr.appendChild(actions);
      tbody.appendChild(tr);
    });

    if (!entries.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 11;
      td.textContent = "ဒီလအတွက် စာရင်းမရှိသေးပါ။";
      tr.appendChild(td);
      tbody.appendChild(tr);
    }

    $("sumWage").textContent = money(wages);
    $("sumOt").textContent = money(ots);
    $("sumExpense").textContent = money(expenses);
    $("sumNet").textContent = money(wages + ots - expenses);
    $("attendance").textContent =
      "အလုပ်ဆင်း " + workDays + " ရက် • ပုံမှန်အလုပ်ချိန် " +
      format(hours) + " နာရီ • မှတ်တမ်း " + entries.length + " ရက်";
  }

  $("saveSettings").onclick = () => {
    const wage = Number($("defaultWage").value);
    if (!Number.isFinite(wage) || wage < 0) {
      message("လုပ်အားခကို သုည သို့မဟုတ် အပေါင်းကိန်း ဖြည့်ပါ။", true);
      return;
    }
    const currency = $("currency").value.trim() || "ကျပ်";
    const next = {
      settings: { wage, currency },
      entries: { ...data.entries }
    };
    if (persist(next)) {
      if (!data.entries[$("date").value] &&
          $("status").value === "work") {
        $("wage").value = wage;
      }
      preview();
      render();
      message("ပုံမှန် သတ်မှတ်ချက် သိမ်းပြီးပါပြီ။");
    }
  };

  $("date").addEventListener("change", () => {
    if ($("date").value) loadDate($("date").value);
  });

  $("status").addEventListener("change", () => {
    const working = $("status").value === "work";
    $("hours").value = working ? 8 : 0;
    $("wage").value = working ? data.settings.wage : 0;
    if (!working) $("ot").value = 0;
    preview();
  });

  $("entryForm").addEventListener("input", preview);

  $("entryForm").addEventListener("submit", event => {
    event.preventDefault();
    if (!$("entryForm").reportValidity()) return;

    const e = readEntry();
    if (numberFields.some(id =>
      !Number.isFinite(Number($(id).value)) || Number($(id).value) < 0
    )) {
      message("ငွေပမာဏနဲ့ အလုပ်ချိန်ကို မှန်ကန်စွာ ဖြည့်ပါ။", true);
      return;
    }

    const exists = Boolean(data.entries[e.date]);
    if (exists && !confirm("ဒီရက်ရဲ့ မူလစာရင်းကို ပြင်ပြီး သိမ်းမလား?")) {
      return;
    }

    const next = {
      settings: { ...data.settings },
      entries: { ...data.entries, [e.date]: e }
    };
    if (persist(next)) {
      $("month").value = e.date.slice(0, 7);
      render();
      message(exists ? "စာရင်း ပြင်သိမ်းပြီးပါပြီ။" : "နေ့စာရင်း သိမ်းပြီးပါပြီ။");
    }
  });

  $("resetForm").onclick = () => loadDate(today());
  $("month").addEventListener("change", render);

  $("exportCsv").onclick = () => {
    const entries = Object.values(data.entries)
      .sort((a, b) => a.date.localeCompare(b.date));
    if (!entries.length) {
      message("ထုတ်ယူရန် စာရင်းမရှိသေးပါ။", true);
      return;
    }

    const rows = [[
      "ရက်စွဲ", "အခြေအနေ", "နာရီ", "လုပ်အားခ", "OT",
      "အခန်းခ", "ဆီဖိုး", "အခြား", "ကျန်ငွေ", "ငွေကြေး", "မှတ်ချက်"
    ]];

    entries.forEach(e => rows.push([
      e.date, statusLabels[e.status], e.hours, e.wage, e.ot,
      e.room, e.fuel, e.other, net(e), data.settings.currency, e.note
    ]));

    function csvCell(value) {
      let text = String(value ?? "");
      // Spreadsheet formula အဖြစ် အလုပ်မလုပ်စေရန်။
      if (typeof value === "string" && /^[\s]*[=+\-@]/.test(text)) {
        text = "'" + text;
      }
      return '"' + text.replace(/"/g, '""') + '"';
    }

    const csv = "\uFEFF" +
      rows.map(row => row.map(csvCell).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "work-ledger-" + today() + ".csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    message("CSV ဖိုင် ထုတ်ယူပြီးပါပြီ။");
  };

  $("defaultWage").value = data.settings.wage;
  $("currency").value = data.settings.currency;
  $("month").value = today().slice(0, 7);
  loadDate(today());
  render();
</script>
</body>
</html>
